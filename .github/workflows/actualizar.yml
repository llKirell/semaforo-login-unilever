name: Actualizar Semaforo

on:
  schedule:
    - cron: "17 */2 * * *" # 12 corridas al día; minuto 17 UTC para evitar el pico de inicio de hora
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Lima
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegador Playwright
        run: python -m playwright install --with-deps chromium

      - name: Generar dashboard (login W4W + saldo)
        env:
          DINET_USER: ${{ secrets.DINET_USER }}
          DINET_PASS: ${{ secrets.DINET_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_run.py

      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
